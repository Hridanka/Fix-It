[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixit-error-helper"
version = "2.0.0"
description = "Language-aware error analysis and repair suggestions for developers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7", "PyYAML>=6.0", "Flask>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
fixit = "fixit.cli:main"

[tool.setuptools.packages.find]
include = ["fixit*", "knowledge_base*", "website*"]

[tool.setuptools.package-data]
knowledge_base = ["*.yaml"]
website = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"